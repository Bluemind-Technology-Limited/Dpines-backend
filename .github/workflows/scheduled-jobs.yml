name: Scheduled Background Jobs

on:
  schedule:
    # Run daily at 09:00 UTC (10:00 WAT)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # GitHub Actions is the scheduler of record (visible history, manual
      # dispatch, easy edits). It does NOT call the backend directly — it
      # publishes each sweep to QStash, which handles delivery, retries and
      # signing. The backend verifies the Upstash-Signature on arrival
      # (see requireCronAuth in src/middlewares/qstash.middleware.ts).
      - name: Enqueue sweeps via QStash
        env:
          QSTASH_URL: "https://qstash-eu-central-1.upstash.io"
          QSTASH_TOKEN: "eyJVc2VySUQiOiJmNjFmMTdkZi1iYzdjLTQ2ZDgtYThkNy04NjRlNDAxY2ViNDciLCJQYXNzd29yZCI6IjZmOGM3ZGRiNThkZDQzMTVhMjVmMzg3ZDk1Nzc4MjhmIn0="
          QSTASH_CURRENT_SIGNING_KEY: "sig_5DWf5jZLhwRWaZ8iSsUU7YoYun9g"
          QSTASH_NEXT_SIGNING_KEY: "sig_4t5pxg2hCuuxVBDqwtBr39dh1uZk"
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL}" ]; then
            echo "BACKEND_URL is empty."
            echo "Set the BACKEND_URL Actions secret to the API origin, e.g. https://your-backend.vercel.app (no trailing slash), then re-run."
            exit 1
          fi
          BACKEND_URL="${BACKEND_URL%/}"
          for job in payment_reminders late_fees maturity; do
            echo "→ enqueuing ${job}"
            curl -fsS -X POST \
              "${QSTASH_URL}/v2/publish/${BACKEND_URL}/api/jobs/trigger/${job}" \
              -H "Authorization: Bearer ${QSTASH_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Upstash-Retries: 3" \
              -d '{}'
            echo
          done
